name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kalender
          POSTGRES_PASSWORD: kalender
          POSTGRES_DB: kalender_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kalender"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database in the service container above; not a real secret.
      DATABASE_URL: postgres://kalender:kalender@localhost:5432/kalender_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
